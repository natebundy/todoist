@let m = milk();
@let c = m.colors;
<svg viewBox="0 0 120 200" role="img" [attr.aria-label]="m.name + ' carton'">
  <!-- Fin (sealed top) -->
  <polygon points="21,24 101,24 101,10 21,10" [attr.fill]="c.body" />
  <polygon points="21,24 101,24 101,20 21,20" [attr.fill]="c.side" opacity="0.6" />
  <!-- Roof slope and gable side -->
  <polygon points="10,60 90,60 101,24 21,24" [attr.fill]="c.roof" />
  <polygon points="90,60 112,48 101,24" [attr.fill]="c.roof" />
  <polygon points="90,60 112,48 101,24" fill="#000" opacity="0.12" />
  <!-- Side panel -->
  <polygon points="90,60 112,48 112,183 90,195" [attr.fill]="c.side" />
  <!-- Front panel -->
  <rect x="10" y="60" width="80" height="135" [attr.fill]="c.body" />
  <rect x="10" y="60" width="6" height="135" fill="#fff" opacity="0.15" />

  @if (!compact()) {
    <text x="50" y="74" text-anchor="middle" font-size="7" font-weight="700" letter-spacing="1.5" [attr.fill]="c.text">
      MILK BARN
    </text>
  }

  <!-- Label window -->
  <rect x="17" y="80" width="66" height="66" rx="8" [attr.fill]="c.label" />

  @switch (m.art) {
    @case ('cow') {
      <path d="M36 97 q-7 -8 -3 -13" stroke="#d9c7a3" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M64 97 q7 -8 3 -13" stroke="#d9c7a3" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="30" cy="103" rx="7" ry="4" fill="#fff" stroke="#333" stroke-width="1.2" transform="rotate(-20 30 103)" />
      <ellipse cx="70" cy="103" rx="7" ry="4" fill="#fff" stroke="#333" stroke-width="1.2" transform="rotate(20 70 103)" />
      <ellipse cx="50" cy="111" rx="17" ry="19" fill="#fff" stroke="#333" stroke-width="1.5" />
      <path d="M38 99 q6 -5 10 1 q-1 8 -10 5 z" fill="#333" />
      <ellipse cx="61" cy="114" rx="4.5" ry="3.5" fill="#333" />
      <circle cx="43" cy="109" r="2" fill="#222" />
      <circle cx="57" cy="107" r="2" fill="#222" />
      <ellipse cx="50" cy="124" rx="12" ry="8" fill="#f7b6c2" stroke="#333" stroke-width="1.2" />
      <circle cx="46" cy="124" r="1.6" fill="#8a4a57" />
      <circle cx="54" cy="124" r="1.6" fill="#8a4a57" />
    }
    @case ('splash') {
      <path d="M50 87 C 58 99, 64 107, 64 115 a14 14 0 0 1 -28 0 C 36 107, 42 99, 50 87 Z" fill="#fff" stroke="#56a5c9" stroke-width="2" />
      <path d="M43 113 q0 -6 4 -10" stroke="#bfe5f5" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M24 141 q8 -9 14 -2 q6 -10 12 0 q6 -10 12 0 q6 -7 14 2 z" fill="#fff" stroke="#56a5c9" stroke-width="1.5" />
      <circle cx="28" cy="130" r="2.5" fill="#fff" stroke="#56a5c9" stroke-width="1" />
      <circle cx="72" cy="128" r="2" fill="#fff" stroke="#56a5c9" stroke-width="1" />
    }
    @case ('chocolate') {
      <g transform="rotate(-12 50 114)">
        <rect x="31" y="88" width="38" height="52" rx="3" fill="#5a3019" stroke="#3a1d0d" stroke-width="1.5" />
        <line x1="43.6" y1="88" x2="43.6" y2="122" stroke="#7a4a2e" stroke-width="1.5" />
        <line x1="56.3" y1="88" x2="56.3" y2="122" stroke="#7a4a2e" stroke-width="1.5" />
        <line x1="31" y1="99" x2="69" y2="99" stroke="#7a4a2e" stroke-width="1.5" />
        <line x1="31" y1="110.5" x2="69" y2="110.5" stroke="#7a4a2e" stroke-width="1.5" />
        <rect x="29" y="120" width="42" height="22" rx="2" fill="#c8323a" />
        <path d="M29 120 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l2 3 z" fill="#d6d6d6" />
      </g>
    }
    @case ('strawberry') {
      <path d="M50 140 C 30 128, 27 108, 34 100 C 40 94, 46 96, 50 98 C 54 96, 60 94, 66 100 C 73 108, 70 128, 50 140 Z" fill="#e8344e" stroke="#b01e35" stroke-width="1.5" />
      <polygon points="50,99 37,93 45,91 41,85 49,89 50,83 51,89 59,85 55,91 63,93" fill="#3d9b3d" stroke="#2a6e2a" stroke-width="0.8" stroke-linejoin="round" />
      <ellipse cx="42" cy="108" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="50" cy="106" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="58" cy="108" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="40" cy="119" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="50" cy="117" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="60" cy="119" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="45" cy="128" rx="1.3" ry="2" fill="#ffe08a" />
      <ellipse cx="55" cy="128" rx="1.3" ry="2" fill="#ffe08a" />
    }
    @case ('banana') {
      <path d="M27 97 C 26 132, 60 145, 80 120 C 62 130, 40 124, 36 97 Z" fill="#ffe14d" stroke="#8a6a00" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M32 104 C 34 124, 52 134, 70 128" stroke="#e0b800" stroke-width="1.5" fill="none" />
      <path d="M27 97 l1 -9 l6 1 l2 8 z" fill="#6b4f00" />
      <circle cx="79" cy="120.5" r="2" fill="#4a3500" />
    }
    @case ('oat') {
      <path d="M50 144 C 50 122, 50 106, 52 88" stroke="#9c7a3c" stroke-width="2" fill="none" />
      <ellipse cx="44" cy="97" rx="3.5" ry="7" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" transform="rotate(-35 44 97)" />
      <ellipse cx="59" cy="95" rx="3.5" ry="7" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" transform="rotate(35 59 95)" />
      <ellipse cx="42" cy="111" rx="3.5" ry="7" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" transform="rotate(-35 42 111)" />
      <ellipse cx="58" cy="109" rx="3.5" ry="7" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" transform="rotate(35 58 109)" />
      <ellipse cx="42" cy="125" rx="3.5" ry="7" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" transform="rotate(-35 42 125)" />
      <ellipse cx="58" cy="123" rx="3.5" ry="7" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" transform="rotate(35 58 123)" />
      <ellipse cx="52" cy="86" rx="3.5" ry="6" fill="#e9c46a" stroke="#9c7a3c" stroke-width="1" />
    }
    @case ('almond') {
      <path d="M40 89 C 50 99, 56 115, 52 129 Q 40 143 28 129 C 24 115, 30 99, 40 89 Z" fill="#b5703f" stroke="#6e3f1d" stroke-width="1.5" />
      <path d="M36 104 q-2 10 0 20 M44 102 q2 12 0 24" stroke="#8a5028" stroke-width="1" fill="none" />
      <g transform="rotate(25 62 116)">
        <path d="M62 91 C 71 100, 76 114, 72 127 Q 62 139 52 127 C 48 114, 53 100, 62 91 Z" fill="#c98451" stroke="#6e3f1d" stroke-width="1.5" />
        <path d="M58 105 q-2 9 0 18 M66 104 q2 10 0 20" stroke="#8a5028" stroke-width="1" fill="none" />
      </g>
    }
    @case ('soy') {
      <g transform="rotate(-30 50 114)">
        <path d="M21 114 C 30 98, 70 98, 79 112 C 71 129, 30 129, 21 114 Z" fill="#8bc34a" stroke="#4f8f3d" stroke-width="1.5" />
        <circle cx="36" cy="113" r="6" fill="#f2e7a1" stroke="#b9a94f" stroke-width="1" />
        <circle cx="50" cy="112" r="6" fill="#f2e7a1" stroke="#b9a94f" stroke-width="1" />
        <circle cx="64" cy="112" r="6" fill="#f2e7a1" stroke="#b9a94f" stroke-width="1" />
        <path d="M79 112 q6 -2 8 -8" stroke="#4f8f3d" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>
    }
    @case ('coconut') {
      <circle cx="61" cy="104" r="15" fill="#7a4b2a" stroke="#4d2c14" stroke-width="1.5" />
      <circle cx="57" cy="99" r="1.8" fill="#3d220f" />
      <circle cx="64" cy="99" r="1.8" fill="#3d220f" />
      <circle cx="60.5" cy="105" r="1.8" fill="#3d220f" />
      <path d="M24 118 a 20 20 0 0 0 40 0 z" fill="#7a4b2a" stroke="#4d2c14" stroke-width="1.5" />
      <path d="M28 118 a 16 16 0 0 0 32 0 z" fill="#fff" />
      <ellipse cx="44" cy="118" rx="20" ry="4" fill="#fff" stroke="#4d2c14" stroke-width="1.5" />
    }
  }

  <!-- Name band -->
  <text x="50" y="164" text-anchor="middle" font-size="10" font-weight="700" [attr.fill]="c.text">
    {{ m.name }}
  </text>
  @if (!compact()) {
    <text x="50" y="184" text-anchor="middle" font-size="8" [attr.fill]="c.text" opacity="0.85">{{ m.volume }}</text>
  }
</svg>
